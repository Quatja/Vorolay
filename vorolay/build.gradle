plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'quatja.com.vorolay'
    compileSdk 36
    defaultConfig {
        minSdk 17
    }
    publishing { singleVariant('release') { withSourcesJar() } }
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                name = 'verification'
                url = rootProject.layout.buildDirectory.dir('verification-repository')
            }
        }
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Quatja'
                artifactId = 'vorolay'
                version = System.getenv('JITPACK') == 'true' ? System.getenv('VERSION') : '1.1.0'
                pom {
                    name = 'Vorolay'
                    description = 'An Android ViewGroup that displays child views in Voronoi regions.'
                    url = 'https://github.com/Quatja/Vorolay'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'Quatja'
                            name = 'Daniil Jurjev'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/Quatja/Vorolay.git'
                        developerConnection = 'scm:git:ssh://git@github.com/Quatja/Vorolay.git'
                        url = 'https://github.com/Quatja/Vorolay'
                    }
                }
            }
        }
    }
}
