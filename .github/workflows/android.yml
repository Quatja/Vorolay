name: Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :vorolay:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :vorolay:lintDebug
      - run: ./gradlew :vorolay:publishReleasePublicationToVerificationRepository
      - run: ./gradlew -p integration-tests/consumer assembleRelease
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            adb install -r integration-tests/consumer/build/outputs/apk/release/VorolayConsumer-release.apk
            adb shell am start -W -n example.vorolay.consumer/.MainActivity
            adb shell pidof example.vorolay.consumer
